apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-deploy
  namespace: aravind-ns
  labels:
    app: practice-app
spec:
  replicas: 8

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 2

  selector:
    matchLabels:
      app: Web

  template:
    metadata:
      labels:
        app: Web
    spec:
      containers:
      - name: practice-container
        image: muralisocial123/fitness-app:v1.0.1
        ports:
        - containerPort: 3000
 

---

apiVersion: v1
kind: Service
metadata:
  name: fitness-service


spec:
  selector:
    app: Web

  ports:
    - port: 3001 # It is a service port number we are using to exose the application to the internet
      targetPort: 3000 # It is a container port number which is defined in the deployment file
      protocol: TCP
      type: ClusterIP